name: Release

# Push a tag such as v0.4.0 (matching Cargo.toml) to build every platform and
# create a draft release with the archives. Review the draft, then publish it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        name: Check the tag matches Cargo.toml
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          if [[ "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  macos:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --locked --release --bin firstcall --bin firstcall-cli
      - name: Package FirstCall.app
        run: |
          FIRSTCALL_ICON_ICNS="$PWD/assets/FirstCall.icns" \
            scripts/package-macos.sh target/release "$RUNNER_TEMP/dist" "${{ needs.version.outputs.version }}"
          python3 scripts/smoke-native.py "$RUNNER_TEMP/dist/FirstCall.app/Contents/MacOS/firstcall-cli" "$RUNNER_TEMP/smoke"
      - uses: actions/upload-artifact@v4
        with:
          name: firstcall-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/dist/*.zip
            ${{ runner.temp }}/dist/*.tar.gz
          if-no-files-found: error

  windows:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --locked --release --bin firstcall --bin firstcall-cli
      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ needs.version.outputs.version }}"
          $name = "firstcall-v$version-x86_64-pc-windows-msvc"
          $dir = Join-Path $env:RUNNER_TEMP $name
          New-Item -ItemType Directory -Path $dir | Out-Null
          Copy-Item target/release/firstcall.exe, target/release/firstcall-cli.exe, LICENSE $dir
          @"
          FirstCall $version for Windows

          Run firstcall.exe to open the app. Keep firstcall-cli.exe in the same
          folder: exported tools run through it.

          If Windows SmartScreen blocks the first launch, choose More info, then Run anyway.
          "@ | Set-Content -Path (Join-Path $dir "README-RELEASE.txt") -Encoding utf8
          $version_line = & (Join-Path $dir "firstcall-cli.exe") version
          if ($version_line -ne "firstcall-cli $version") { throw "Unexpected version: $version_line" }
          New-Item -ItemType Directory -Path dist | Out-Null
          Compress-Archive -Path $dir -DestinationPath "dist/$name.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: firstcall-windows
          path: dist/*.zip
          if-no-files-found: error

  linux:
    needs: version
    # The oldest supported runner keeps the glibc requirement low.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libfontconfig1-dev libgl1-mesa-dev \
            libudev-dev libwayland-dev libx11-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxcursor-dev libxi-dev libxinerama-dev libxkbcommon-dev libxrandr-dev
      - run: cargo build --locked --release --bin firstcall --bin firstcall-cli
      - name: Package
        run: |
          version="${{ needs.version.outputs.version }}"
          name="firstcall-v$version-x86_64-unknown-linux-gnu"
          mkdir -p "$RUNNER_TEMP/$name" dist
          install -m 0755 target/release/firstcall target/release/firstcall-cli "$RUNNER_TEMP/$name/"
          install -m 0644 LICENSE "$RUNNER_TEMP/$name/"
          cat > "$RUNNER_TEMP/$name/README-RELEASE.txt" <<EOF
          FirstCall $version for Linux (x86_64)

          Run ./firstcall to open the app. Keep firstcall-cli in the same folder:
          exported tools run through it. The app needs an X11 or Wayland desktop.
          EOF
          test "$("$RUNNER_TEMP/$name/firstcall-cli" version)" = "firstcall-cli $version"
          python3 scripts/smoke-native.py "$RUNNER_TEMP/$name/firstcall-cli" "$RUNNER_TEMP/smoke"
          tar -C "$RUNNER_TEMP" -czf "dist/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: firstcall-linux
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: [version, macos, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd release
          sha256sum firstcall-* > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" --draft --title "FirstCall $GITHUB_REF_NAME" \
            --notes "Downloads for macOS (Apple Silicon and Intel), Windows and Linux." ./*
